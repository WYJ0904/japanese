name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit tracked files and membership naming
        run: python scripts/repository_audit.py

      - name: Run Python backend tests
        working-directory: local-backend
        run: python -m unittest discover -p "test_*.py" -v

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check tools.js
          node --check sw.js
          node --check "functions/api/[[path]].js"

      - name: Test Pages API proxy
        run: node local-backend/test_proxy_js.mjs

      - name: Test JavaScript tools
        run: node local-backend/test_tools_js.mjs
